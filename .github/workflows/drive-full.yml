name: 雲端原檔備份（不縮圖）

on:
  push:
    branches: [main]
    paths: ["komazawa/pro_full/folders.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 下載原檔
        run: |
          while read -r fid dir; do
            [ -z "$fid" ] && continue
            python3 komazawa/reels/tools/drive_full.py "$fid" "komazawa/pro_full/$dir"
          done < komazawa/pro_full/folders.txt
          find komazawa/pro_full -type f -size +95M -print -delete
      - name: 存檔
        run: |
          git config user.name "eason-autopost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A komazawa/pro_full
          git diff --cached --quiet || (git commit -m "駒澤屋攝影原檔備份" && git pull --rebase -q && git push -q)
